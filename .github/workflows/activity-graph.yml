name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "15 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Md-Azharuddin02
          options: >-
            theme=tokyo-night&
            hide_border=true&
            area=true&
            custom_title=GitHub%20Contribution%20Activity
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Activity Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity-graph.svg

          git diff --cached --quiet || git commit -m "chore: update activity graph"

          git push
