name: Deploy Interactive Terminal

on:
  push:
    branches:
      - main
    paths:
      - "terminal/**"
      - ".github/workflows/terminal-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Create a clean deployment directory
      - name: Build Pages site
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp terminal/index.html dist/index.html
          cp terminal/terminal.css dist/terminal.css
          cp terminal/terminal.js dist/terminal.js

          echo "=============================="
          echo "Files being deployed:"
          echo "=============================="

          find dist -maxdepth 1 -type f -print

          echo "=============================="
          echo "Checking index.html:"
          echo "=============================="

          test -f dist/index.html
          test -f dist/terminal.css
          test -f dist/terminal.js

          grep -n "<title>" dist/index.html

      # 3. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 4. Upload ONLY the terminal
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 5. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
