name: Deploy Interactive Terminal

on:
  push:
    branches:
      - main
    paths:
      - "terminal/**"
      - ".github/workflows/terminal-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload terminal
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./terminal"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
