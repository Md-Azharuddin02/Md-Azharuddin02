name: Generate Contribution Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Md-Azharuddin02
          outputs: |
            profile/contribution-snake.svg
            profile/contribution-snake-dark.svg?palette=github-dark

      - name: Commit Snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contribution-snake.svg profile/contribution-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution snake"
            git push
          fi
