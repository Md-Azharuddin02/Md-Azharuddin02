<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive developer terminal — Md Azharuddin" />
  <title>md-azharuddin@portfolio:~</title>
  <link rel="stylesheet" href="./terminal.css" />
</head>
<body>
  <main class="page">
    <section class="terminal" aria-label="Interactive developer terminal">
      <header class="titlebar">
        <div class="traffic-lights" aria-hidden="true">
          <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        </div>
        <div class="window-title">md-azharuddin@portfolio: ~</div>
        <button class="clear-window" id="clearWindow" type="button" title="Clear terminal">⌫</button>
      </header>

      <div class="terminal-body" id="terminalBody" tabindex="0">
        <div id="output" aria-live="polite"></div>

        <form id="commandForm" class="prompt-row" autocomplete="off">
          <span class="prompt" aria-hidden="true">md-azharuddin@portfolio:~$</span>
          <input id="commandInput" name="command" aria-label="Terminal command"
                 spellcheck="false" autofocus />
        </form>
      </div>
    </section>

    <div class="quick-actions" aria-label="Suggested commands">
      <button type="button" data-command="help">help</button>
      <button type="button" data-command="about">about</button>
      <button type="button" data-command="skills">skills</button>
      <button type="button" data-command="projects">projects</button>
      <button type="button" data-command="recommend">recommend</button>
      <button type="button" data-command="contact">contact</button>
    </div>

    <p class="hint">Type <code>help</code> to explore. Use ↑ / ↓ for command history.</p>
  </main>

  <script src="./terminal.js"></script>
</body>
</html>
